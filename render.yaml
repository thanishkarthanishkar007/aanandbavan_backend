services:
  - type: web
    name: aanandbavan-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: srenewaanandbavan
      - key: ADMIN_EMAIL
        value: srenewaanandbavan@gmail.com
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
